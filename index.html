<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bleaches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Yuji+Syuku&display=swap">
<style>
  /* One fixed night-time Seireitei look: the canvas is the whole page. */
  :root { --ink: #0c0b14; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ink); display: grid; place-items: center; overflow: hidden; padding-inline: 16px; box-sizing: border-box; }
  .stage { position: relative; width: min(100%, calc(100vh * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #scene { background: var(--ink); }
</style>
</head>
<body>
<div class="stage">
  <canvas id="scene" width="1280" height="720" aria-hidden="true"></canvas>
  <canvas id="hud" width="1280" height="720" tabindex="0" aria-label="The Bleaches: a 3D fighting game played with the keyboard or an Xbox controller"></canvas>
</div>
<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/status.js"></script>
<script src="js/fighter.js"></script>
<script src="js/characters.js"></script>
<script src="js/world.js"></script>
<script src="js/ai.js"></script>
<script src="js/gamepad.js"></script>
<script src="js/look.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
